name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  # 允許在 Actions 頁面手動重跑，不用硬推一個 commit
  workflow_dispatch:

# deploy-pages 需要這三個權限才寫得進 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一份部署；已經在跑的不中斷，避免部署到一半被砍
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 建置
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v7

      - name: 安裝 Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: 安裝相依套件
        run: npm ci

      - name: 跑單元測試
        run: npm test

      - name: 建置 dist
        run: npm run build

      - name: 設定 Pages
        uses: actions/configure-pages@v6

      - name: 上傳 dist
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: 部署
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
